name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NORA_SCOPE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Check Nora qualification scope
        if: github.event_name == 'pull_request' && contains(github.head_ref, 'qualification')
        run: npm run check:qualification-scope

      - name: Check legacy WorkItem references
        run: npm run check:legacy-workitem-refs -- --static-only

      - name: Check Cycle 1 tenant inventory
        run: node --import tsx scripts/check-tenant-inventory.ts

      - name: Check deployment database safety scope
        run: npm run check:deployment-db-safety-scope

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

  application:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PLAYWRIGHT_ENFORCE_DISPOSABLE_DB: "1"
      PLAYWRIGHT_USE_PRODUCTION_SERVER: "1"
      PLAYWRIGHT_HOST: localhost
      PLAYWRIGHT_BASE_URL: http://localhost:4173
      PORT: "4173"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=public
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/shadow?schema=public
      EXPECTED_DATABASE_ENV: test
      SESSION_SECRET: ci-session-secret-minimum-32-characters-long
      RESTORE_INTEGRATION: "1"
      RESTORE_INTEGRATION_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Derive and initialize disposable database identity
        run: |
          FINGERPRINT=$(node -e "const {createHash}=require('node:crypto'); process.stdout.write(createHash('sha256').update(['policydesk-db:v1','ci-local','ci-application','postgres'].join('\\0')).digest('hex'))")
          echo "EXPECTED_DATABASE_FINGERPRINT=$FINGERPRINT" >> "$GITHUB_ENV"
          npm run init:deployment-db-identity -- --environment test --project-id ci-local --branch-id ci-application --database postgres --endpoint-id 127 --apply --json

      - name: Check deployment database identity
        run: npm run check:deployment-db-safety

      - name: Deployment database safety integration
        env:
          DEPLOYMENT_SAFETY_INTEGRATION: "1"
        run: npm run test:unit -- src/lib/deployment-db-safety.integration.logic.test.ts

      - name: Check migration drift
        run: npm run db:check-drift

      - name: Check Cycle 1 tenant guards
        run: npm run check:tenant-guards

      - name: Organization transition integration against disposable PostgreSQL
        run: npm run test:unit -- src/lib/organization-transition.integration.logic.test.ts

      - name: Backup restore integration against disposable PostgreSQL
        run: npm run test:unit -- src/lib/backup-restore.integration.logic.test.ts

      - name: Build production application
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: API tests against production server
        run: npm run test:api

      - name: E2E tests against production server
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload sanitized restore drill reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill-reports-${{ github.run_attempt }}
          path: artifacts/restore-drills
          if-no-files-found: ignore
          retention-days: 90
