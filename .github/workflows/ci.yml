name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NORA_SCOPE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Check Nora qualification scope
        if: github.event_name == 'pull_request' && contains(github.head_ref, 'qualification')
        run: npm run check:qualification-scope

      - name: Check legacy WorkItem references
        run: npm run check:legacy-workitem-refs -- --static-only

      - name: Check Cycle 1 tenant inventory
        run: node --import tsx scripts/check-tenant-inventory.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

  tenant-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NODE_ENV: test
      TENANT_ISOLATION_TEST_DB: "1"
      PLAYWRIGHT_ENFORCE_DISPOSABLE_DB: "1"
      TENANT_ISOLATION_RUN_ID: "${{ github.run_id }}_${{ github.run_attempt }}"
      TENANT_ISOLATION_DB_NAME: "policydesk_tenant_test_${{ github.run_id }}_${{ github.run_attempt }}"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/policydesk_tenant_test_${{ github.run_id }}_${{ github.run_attempt }}?schema=public
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/policydesk_tenant_test_${{ github.run_id }}_${{ github.run_attempt }}?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/shadow?schema=public
      SESSION_SECRET: tenant-isolation-ci-secret-minimum-32-characters
      VERCEL_ENV: ""
      PLAYWRIGHT_E2E: "1"
      TENANT_ISOLATION_E2E: "1"
      PLAYWRIGHT_USE_PRODUCTION_SERVER: "1"
      PLAYWRIGHT_HOST: localhost
      PLAYWRIGHT_BASE_URL: http://localhost:4173
      PORT: "4173"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate

      - name: Create dedicated tenant database
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          db_name="${TENANT_ISOLATION_DB_NAME}"
          createdb -h 127.0.0.1 -U postgres "$db_name"

      - name: Apply migrations to disposable PostgreSQL
        run: npx prisma migrate deploy

      - name: Mark migrated tenant database
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          db_name="${TENANT_ISOLATION_DB_NAME}"
          host_name="127.0.0.1"
          fingerprint="$(printf 'local-postgres:%s:%s:%s' "$TENANT_ISOLATION_RUN_ID" "$db_name" "$host_name" | sha256sum | awk '{print $1}')"
          psql -h "$host_name" -U postgres -d "$db_name" -v ON_ERROR_STOP=1 <<SQL
          CREATE TABLE "__policydesk_tenant_isolation_run" (
            run_id text PRIMARY KEY,
            database_name text NOT NULL,
            host text NOT NULL,
            fingerprint text NOT NULL,
            created_at timestamptz NOT NULL DEFAULT now()
          );
          INSERT INTO "__policydesk_tenant_isolation_run" (run_id, database_name, host, fingerprint)
          VALUES ('$TENANT_ISOLATION_RUN_ID', '$db_name', '$host_name', '$fingerprint');
          SQL
          printf 'TENANT_ISOLATION_FINGERPRINT=%s\n' "$fingerprint" >> "$GITHUB_ENV"

      - name: Create protected two-organization fixture
        run: npm run test:tenant-fixture
      - name: Run tenant context and export tests
        run: npm run test:unit -- src/lib/organization-context.logic.test.ts src/lib/export.logic.test.ts src/lib/tenant-isolation.integration.logic.test.ts
      - name: Check tenant inventory
        run: node --import tsx scripts/check-tenant-inventory.ts
      - name: Build tenant-isolation application
        run: npm run build
      - name: Tenant isolation Chromium E2E
        run: npm run test:e2e -- tests/e2e/tenant-isolation.spec.ts

      - name: Drop dedicated tenant database
        if: always()
        shell: bash
        run: |
          export PGPASSWORD=postgres
          dropdb -h 127.0.0.1 -U postgres --if-exists "$TENANT_ISOLATION_DB_NAME"

  application:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PLAYWRIGHT_ENFORCE_DISPOSABLE_DB: "1"
      PLAYWRIGHT_USE_PRODUCTION_SERVER: "1"
      PLAYWRIGHT_HOST: localhost
      PLAYWRIGHT_BASE_URL: http://localhost:4173
      PORT: "4173"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/shadow?schema=public
      SESSION_SECRET: ci-session-secret-minimum-32-characters-long
      RESTORE_INTEGRATION: "1"
      RESTORE_INTEGRATION_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Check migration drift
        run: npm run db:check-drift

      - name: Check Cycle 1 tenant guards
        run: npm run check:tenant-guards

      - name: Organization transition integration against disposable PostgreSQL
        run: npm run test:unit -- src/lib/organization-transition.integration.logic.test.ts

      - name: Backup restore integration against disposable PostgreSQL
        run: npm run test:unit -- src/lib/backup-restore.integration.logic.test.ts

      - name: Build production application
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: API tests against production server
        run: npm run test:api

      - name: E2E tests against production server
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload sanitized restore drill reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill-reports-${{ github.run_attempt }}
          path: artifacts/restore-drills
          if-no-files-found: ignore
          retention-days: 90
