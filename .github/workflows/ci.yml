name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NORA_SCOPE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Check Nora qualification scope
        if: github.event_name == 'pull_request' && contains(github.head_ref, 'qualification')
        run: npm run check:qualification-scope

      - name: Check legacy WorkItem references
        run: npm run check:legacy-workitem-refs -- --static-only

      - name: Check Cycle 1 tenant inventory
        run: node --import tsx scripts/check-tenant-inventory.ts

      - name: Check tenant write scope
        run: npm run check:tenant-write-scope

      - name: Check tenant read scope
        run: npm run check:tenant-read-scope

      - name: Check tenant DAL inventory
        run: npm run check:tenant-dal:strict

      - name: Check API security manifest
        run: npm run check:api-security

      - name: Check Server Action authorization
        run: npm run check:server-actions

      - name: Check activity-log tenant scope
        run: npm run check:activity-log-scope

      - name: Check organization metadata hardcodes
        run: npm run check:organization-metadata-hardcodes

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

  tenant-isolation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NODE_ENV: test
      TENANT_ISOLATION_TEST_DB: "1"
      PLAYWRIGHT_ENFORCE_DISPOSABLE_DB: "1"
      TENANT_ISOLATION_RUN_ID: "${{ github.run_id }}_${{ github.run_attempt }}"
      TENANT_ISOLATION_DB_NAME: "policydesk_tenant_test_${{ github.run_id }}_${{ github.run_attempt }}"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/policydesk_tenant_test_${{ github.run_id }}_${{ github.run_attempt }}?schema=public
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/policydesk_tenant_test_${{ github.run_id }}_${{ github.run_attempt }}?schema=public
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/policydesk_tenant_test_${{ github.run_id }}_${{ github.run_attempt }}?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/shadow?schema=public
      SESSION_SECRET: tenant-isolation-ci-secret-minimum-32-characters
      VERCEL_ENV: ""
      PLAYWRIGHT_E2E: "1"
      TENANT_ISOLATION_E2E: "1"
      PLAYWRIGHT_USE_PRODUCTION_SERVER: "1"
      PLAYWRIGHT_HOST: localhost
      PLAYWRIGHT_BASE_URL: http://localhost:4173
      PORT: "4173"
      TENANT_RLS_APP_ROLE: policydesk_app
      TENANT_RLS_ORG_A: org_legacy_singleton_0001
      TENANT_RLS_ORG_B: org_pedro_gomez_0001
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate

      - name: Create dedicated tenant database
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          db_name="${TENANT_ISOLATION_DB_NAME}"
          createdb -h 127.0.0.1 -U postgres "$db_name"

      - name: Apply migrations to disposable PostgreSQL
        run: npm run db:migrate:singleton-ci

      - name: Mark migrated tenant database
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          db_name="${TENANT_ISOLATION_DB_NAME}"
          host_name="127.0.0.1"
          fingerprint="$(printf 'local-postgres:%s:%s:%s' "$TENANT_ISOLATION_RUN_ID" "$db_name" "$host_name" | sha256sum | awk '{print $1}')"
          psql -h "$host_name" -U postgres -d "$db_name" -v ON_ERROR_STOP=1 <<SQL
          CREATE TABLE "__policydesk_tenant_isolation_run" (
            run_id text PRIMARY KEY,
            database_name text NOT NULL,
            host text NOT NULL,
            fingerprint text NOT NULL,
            created_at timestamptz NOT NULL DEFAULT now()
          );
          INSERT INTO "__policydesk_tenant_isolation_run" (run_id, database_name, host, fingerprint)
          VALUES ('$TENANT_ISOLATION_RUN_ID', '$db_name', '$host_name', '$fingerprint');
          SQL
          printf 'TENANT_ISOLATION_FINGERPRINT=%s\n' "$fingerprint" >> "$GITHUB_ENV"

      - name: Create protected two-organization fixture
        run: npm run test:tenant-fixture
      - name: Run tenant context and export tests
        run: npm run test:unit -- src/lib/organization-context.logic.test.ts src/lib/organization-context-resolution.logic.test.ts src/lib/export.logic.test.ts src/lib/platform-dashboard.logic.test.ts src/lib/tenant-isolation.integration.logic.test.ts
      - name: Check tenant inventory
        run: node --import tsx scripts/check-tenant-inventory.ts
      - name: Build tenant-isolation application
        run: npm run build
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: npx playwright install chromium
      - name: Enter maintenance mode for disposable RLS cutover
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          psql -h 127.0.0.1 -U postgres -d "$TENANT_ISOLATION_DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'UPDATE "PlatformRuntimeState" SET "writeMode" = '\''MAINTENANCE'\'', "reason" = '\''tenant isolation certification'\'', "updatedAt" = now() WHERE "id" = 1;'
      - name: Apply committed RLS cutover on disposable PostgreSQL
        run: ENABLE_TENANT_RLS_CUTOVER=1 npm run cutover:multi-org
      - name: Provision restricted runtime credential for post-RLS browser smoke
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          psql -h 127.0.0.1 -U postgres -d "$TENANT_ISOLATION_DB_NAME" -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE policydesk_app PASSWORD 'tenant-isolation-runtime-password';"
          runtime_url="postgresql://policydesk_app:tenant-isolation-runtime-password@127.0.0.1:5432/${TENANT_ISOLATION_DB_NAME}?schema=public"
          printf 'DATABASE_URL=%s\n' "$runtime_url" >> "$GITHUB_ENV"
          printf 'DATABASE_URL_UNPOOLED=%s\n' "$runtime_url" >> "$GITHUB_ENV"
      - name: Run exact-role RLS tests
        run: npm run test:tenant-rls
      - name: Check Prisma drift after cutover
        run: npm run db:check-drift
      - name: Tenant isolation Chromium E2E after forced RLS
        run: npx playwright test tests/e2e/tenant-isolation.spec.ts
      - name: Archive Stage 2 tenant evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage2-evidence
          git rev-parse HEAD > stage2-evidence/deployed-sha.txt
          set +e
          node --import tsx scripts/check-tenant-dal-inventory.mjs --json > stage2-evidence/tenant-dal-inventory.json
          node --import tsx scripts/check-tenant-read-scope.ts --json > stage2-evidence/tenant-read-scope.json
          node --import tsx scripts/check-tenant-write-scope.ts --json > stage2-evidence/tenant-write-scope.json
          node scripts/check-api-security-manifest.mjs > stage2-evidence/api-security.txt
          node scripts/check-server-actions.mjs > stage2-evidence/server-actions.txt
          set -e
          cp -R playwright-report stage2-evidence/playwright-report 2>/dev/null || true
          cp -R test-results stage2-evidence/test-results 2>/dev/null || true
      - name: Upload Stage 2 tenant evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-tenant-evidence-${{ github.sha }}
          path: stage2-evidence
          if-no-files-found: warn

      - name: Drop dedicated tenant database
        if: always()
        shell: bash
        run: |
          export PGPASSWORD=postgres
          dropdb -h 127.0.0.1 -U postgres --if-exists "$TENANT_ISOLATION_DB_NAME"

  application:
    # Keep the full disposable-Postgres application/browser path available on
    # demand, and run it automatically for pull requests so UI regressions do
    # not wait for a manual certification dispatch.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NODE_ENV: test
      TENANT_ISOLATION_TEST_DB: "1"
      PLAYWRIGHT_ENFORCE_DISPOSABLE_DB: "1"
      TENANT_ISOLATION_RUN_ID: "${{ github.run_id }}_${{ github.run_attempt }}"
      TENANT_ISOLATION_DB_NAME: "policydesk_tenant_test_${{ github.run_id }}_${{ github.run_attempt }}"
      PLAYWRIGHT_USE_PRODUCTION_SERVER: "1"
      PLAYWRIGHT_HOST: localhost
      PLAYWRIGHT_BASE_URL: http://localhost:4173
      PORT: "4173"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/policydesk_tenant_test_${{ github.run_id }}_${{ github.run_attempt }}?schema=public
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/policydesk_tenant_test_${{ github.run_id }}_${{ github.run_attempt }}?schema=public
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/policydesk_tenant_test_${{ github.run_id }}_${{ github.run_attempt }}?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/shadow?schema=public
      SESSION_SECRET: ci-session-secret-minimum-32-characters-long
      RESTORE_INTEGRATION: "1"
      RESTORE_INTEGRATION_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Create dedicated certification database
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          createdb -h 127.0.0.1 -U postgres "$TENANT_ISOLATION_DB_NAME"
          fingerprint=$(node -e 'const {createHash}=require("node:crypto"); const runId=process.env.TENANT_ISOLATION_RUN_ID; const db=process.env.TENANT_ISOLATION_DB_NAME; console.log(createHash("sha256").update(`local-postgres:${runId}:${db}:127.0.0.1`).digest("hex"));')
          echo "TENANT_ISOLATION_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"

      - name: Apply Prisma migrations
        run: npm run db:migrate:singleton-ci

      - name: Check Cycle 1 tenant guards
        run: npm run check:tenant-guards

      - name: Organization transition integration against disposable PostgreSQL
        run: npm run test:unit -- src/lib/organization-transition.integration.logic.test.ts

      - name: Backup restore integration against disposable PostgreSQL
        run: npm run test:unit -- src/lib/backup-restore.integration.logic.test.ts

      - name: Build production application
        run: npm run build

      - name: Cache Playwright browsers
        id: application-playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser
        if: steps.application-playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: npx playwright install chromium

      - name: API tests against production server
        run: npm run test:api

      - name: E2E tests against production server
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload sanitized restore drill reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: restore-drill-reports-${{ github.run_attempt }}
          path: artifacts/restore-drills
          if-no-files-found: ignore
          retention-days: 90

      - name: Drop dedicated certification database
        if: always()
        shell: bash
        run: |
          export PGPASSWORD=postgres
          dropdb -h 127.0.0.1 -U postgres --if-exists "$TENANT_ISOLATION_DB_NAME"
