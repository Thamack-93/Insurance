name: Database backup

on:
  schedule:
    - cron: "5 3 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backup job
        shell: bash
        env:
          BACKUP_JOB_URL: ${{ secrets.BACKUP_JOB_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${BACKUP_JOB_URL:-}" ]]; then
            echo "BACKUP_JOB_URL is missing."
            exit 1
          fi
          if [[ -z "${CRON_SECRET:-}" ]]; then
            echo "CRON_SECRET is missing."
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${BACKUP_JOB_URL}?force=1"
