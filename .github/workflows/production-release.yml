name: Production release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current head of main
        required: true
        type: string
      additive_migrations_confirmed:
        description: Confirm migrations are additive and rollback-compatible
        required: true
        type: boolean

permissions:
  contents: read
  checks: read
  deployments: write

concurrency:
  group: policydesk-production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && inputs.additive_migrations_confirmed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      VERCEL_CLI: vercel@48.11.0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Fail closed on SHA, main, checks and Environment protection
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
          RUNS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/check-runs?per_page=100")
          printf '%s' "$RUNS" | jq -e '[.check_runs[] | select((.name == "quality" or .name == "application") and .status == "completed" and .conclusion == "success")] | map(.name) | unique | length == 2' >/dev/null
          ENVIRONMENT=$(gh api "repos/$GITHUB_REPOSITORY/environments/production")
          RULES=$(printf '%s' "$ENVIRONMENT" | jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers | length] | add // 0')
          test "$RULES" -ge 1
          printf '%s' "$ENVIRONMENT" | jq -e '.deployment_branch_policy.custom_branch_policies == true' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/environments/production/deployment-branch-policies" --jq '[.branch_policies[] | select(.name == "main")] | length == 1' | grep -qx true

      - name: Install release tooling
        run: npm ci

      - name: Verify restricted runtime baseline before any mutation
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          RESPONSE=$(curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&state=READY&limit=1")
          PREVIOUS_ID=$(printf '%s' "$RESPONSE" | jq -r '.deployments[0].uid // empty')
          PREVIOUS_URL=$(printf '%s' "$RESPONSE" | jq -r '.deployments[0].url // empty')
          test -n "$PREVIOUS_ID"
          test -n "$PREVIOUS_URL"
          ENVS=$(curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env")
          printf '%s' "$ENVS" | jq -e '[.envs[] | select((.target | index("production")) and .key == "EXPECTED_DATABASE_ROLE")] | length == 1' >/dev/null
          printf '%s' "$ENVS" | jq -e '[.envs[] | select((.target | index("production")) and (.key == "DATABASE_URL_UNPOOLED" or .key == "NEON_API_KEY"))] | length == 0' >/dev/null
          printf 'PREVIOUS_DEPLOYMENT_ID=%s\nPREVIOUS_DEPLOYMENT_URL=https://%s\n' "$PREVIOUS_ID" "$PREVIOUS_URL" >> "$GITHUB_ENV"

      - name: Verify Production Neon topology before recovery mutation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_RUNTIME_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_ADMIN_URL_UNPOOLED }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          EXPECTED_DATABASE_ENV: production
          EXPECTED_DATABASE_FINGERPRINT: ${{ secrets.EXPECTED_DATABASE_FINGERPRINT }}
          EXPECTED_DATABASE_ROLE: policydesk_runtime
        run: |
          npm run init:deployment-db-identity -- --environment production --project-id "${{ secrets.NEON_PROJECT_ID }}" --branch-id "${{ secrets.NEON_PRODUCTION_BRANCH_ID }}" --database "${{ secrets.NEON_DATABASE_NAME }}" --endpoint-id "${{ secrets.NEON_PRODUCTION_ENDPOINT_ID }}" --json
          npm run check:deployment-db-safety -- --admin

      - name: Verify topology and create protected recovery branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PRODUCTION_BRANCH_ID: ${{ secrets.NEON_PRODUCTION_BRANCH_ID }}
        run: |
          NAME="recovery-release-${GITHUB_RUN_ID}"
          BODY=$(jq -n --arg parent "$NEON_PRODUCTION_BRANCH_ID" --arg name "$NAME" '{branch:{parent_id:$parent,name:$name,protected:true},endpoints:[{type:"read_write"}]}')
          RESPONSE=$(curl --fail --silent --show-error --max-time 30 -X POST -H "Authorization: Bearer $NEON_API_KEY" -H 'Content-Type: application/json' --data "$BODY" "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches")
          RECOVERY_ID=$(printf '%s' "$RESPONSE" | jq -r '.branch.id // empty')
          RECOVERY_PARENT=$(printf '%s' "$RESPONSE" | jq -r '.branch.parent_id // empty')
          RECOVERY_PROTECTED=$(printf '%s' "$RESPONSE" | jq -r '.branch.protected // false')
          test -n "$RECOVERY_ID"
          test "$RECOVERY_PARENT" = "$NEON_PRODUCTION_BRANCH_ID"
          test "$RECOVERY_PROTECTED" = true
          printf 'RECOVERY_BRANCH_ID=%s\n' "$RECOVERY_ID" >> "$GITHUB_ENV"

      - name: Migrate, initialize identity and audit as admin
        env:
          DATABASE_URL: ${{ secrets.DATABASE_ADMIN_URL_UNPOOLED }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_ADMIN_URL_UNPOOLED }}
          DATABASE_RUNTIME_URL: ${{ secrets.DATABASE_RUNTIME_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          EXPECTED_DATABASE_ENV: production
          EXPECTED_DATABASE_FINGERPRINT: ${{ secrets.EXPECTED_DATABASE_FINGERPRINT }}
          EXPECTED_DATABASE_ROLE: policydesk_runtime
          ALLOW_PRODUCTION_DEPLOYMENT_IDENTITY_APPLY: "1"
        run: |
          npx prisma migrate deploy
          npm run init:deployment-db-identity -- --environment production --project-id "${{ secrets.NEON_PROJECT_ID }}" --branch-id "${{ secrets.NEON_PRODUCTION_BRANCH_ID }}" --database "${{ secrets.NEON_DATABASE_NAME }}" --endpoint-id "${{ secrets.NEON_PRODUCTION_ENDPOINT_ID }}" --apply --json
          npm run provision:database-runtime-role -- --apply
          DATABASE_URL="${{ secrets.DATABASE_RUNTIME_URL }}" npm run check:deployment-db-safety -- --admin

      - name: Build exact SHA and deploy prebuilt artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes "$VERCEL_CLI" pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx --yes "$VERCEL_CLI" build --prod --token "$VERCEL_TOKEN"
          DEPLOYMENT_URL=$(npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --skip-domain --token "$VERCEL_TOKEN")
          printf 'NEW_DEPLOYMENT_URL=%s\n' "$DEPLOYMENT_URL" >> "$GITHUB_ENV"

      - name: Verify candidate SHA and READY state
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          HOST=${NEW_DEPLOYMENT_URL#https://}
          DETAIL=$(curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$HOST")
          test "$(printf '%s' "$DETAIL" | jq -r '.readyState // empty')" = READY
          test "$(printf '%s' "$DETAIL" | jq -r '.meta.githubCommitSha // empty')" = "$EXPECTED_SHA"
          NEW_ID=$(printf '%s' "$DETAIL" | jq -r '.id // .uid // empty')
          test -n "$NEW_ID"
          printf 'NEW_DEPLOYMENT_ID=%s\n' "$NEW_ID" >> "$GITHUB_ENV"

      - name: Authenticated smoke
        id: smoke
        continue-on-error: true
        env:
          PRODUCTION_SMOKE_BASE_URL: ${{ env.NEW_DEPLOYMENT_URL }}
          PRODUCTION_SMOKE_EMAIL: ${{ secrets.PRODUCTION_SMOKE_EMAIL }}
          PRODUCTION_SMOKE_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_PASSWORD }}
        run: |
          npx playwright install --with-deps chromium
          npm run smoke:production-release

      - name: Verify restricted alias remained unchanged on failed smoke
        if: steps.smoke.outcome != 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          ACTIVE=$(curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&state=READY&limit=1")
          test "$(printf '%s' "$ACTIVE" | jq -r '.deployments[0].uid // empty')" = "$PREVIOUS_DEPLOYMENT_ID"
          exit 1

      - name: Inspect candidate runtime logs
        if: steps.smoke.outcome == 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          EVENTS=$(curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v2/deployments/$NEW_DEPLOYMENT_ID/events?limit=1000")
          printf '%s' "$EVENTS" | jq -e '[.[]? | select(((.text // "") | test("P2022|User.platformRole|missing column|Prisma schema"; "i")))] | length == 0' >/dev/null

      - name: Promote candidate only after all gates PASS
        if: steps.smoke.outcome == 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes "$VERCEL_CLI" promote "$NEW_DEPLOYMENT_URL" --token "$VERCEL_TOKEN" --yes

      - name: Write sanitized release evidence
        run: |
          mkdir -p artifacts/production-release
          jq -n --arg sha "${{ inputs.expected_sha }}" --arg previous "$PREVIOUS_DEPLOYMENT_ID" --arg deployment "$NEW_DEPLOYMENT_ID" --arg recovery "$RECOVERY_BRANCH_ID" --arg run "$GITHUB_RUN_ID" '{status:"PASS",sha:$sha,previousDeploymentId:$previous,deploymentId:$deployment,recoveryBranchId:$recovery,runId:$run,migrations:"applied",identityAudit:"PASS",runtimeLogs:"PASS",smoke:"PASS",promotion:"PASS"}' > artifacts/production-release/release.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-release-${{ github.run_id }}
          path: artifacts/production-release
          if-no-files-found: warn
          retention-days: 90
