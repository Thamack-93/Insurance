name: Release Certification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "SHA, branch or tag to certify"
        required: true
        default: main
        type: string
      verify_production:
        description: "Run the explicitly authorized read-only Production verifier"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-certification-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  resolve-ref:
    name: RESOLVE REQUESTED REF / NO SECRETS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      certified_sha: ${{ steps.resolve.outputs.certified_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
      - name: Resolve immutable certification SHA
        id: resolve
        shell: bash
        run: echo "certified_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  quality:
    name: CODE CERTIFICATION / QUALITY
    needs: resolve-ref
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NORA_SCOPE_BASE_SHA: ${{ needs.resolve-ref.outputs.certified_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-ref.outputs.certified_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Static architecture and tenant guards
        run: |
          npm run check:legacy-workitem-refs -- --static-only
          node --import tsx scripts/check-tenant-inventory.ts
          npm run check:tenant-dal:strict
          npm run check:tenant-write-scope
          npm run check:tenant-read-scope
          npm run check:api-security
          npm run check:server-actions
          npm run check:activity-log-scope
          npm run check:organization-metadata-hardcodes
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build

  disposable-tenant:
    name: DISPOSABLE POSTGRESQL / TENANT ISOLATION
    needs: resolve-ref
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NODE_ENV: test
      TENANT_ISOLATION_TEST_DB: "1"
      PLAYWRIGHT_ENFORCE_DISPOSABLE_DB: "1"
      TENANT_ISOLATION_RUN_ID: "${{ github.run_id }}_${{ github.run_attempt }}"
      TENANT_ISOLATION_DB_NAME: "policydesk_tenant_test_${{ github.run_id }}_${{ github.run_attempt }}"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/policydesk_tenant_test_${{ github.run_id }}_${{ github.run_attempt }}?schema=public
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/policydesk_tenant_test_${{ github.run_id }}_${{ github.run_attempt }}?schema=public
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/policydesk_tenant_test_${{ github.run_id }}_${{ github.run_attempt }}?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/shadow?schema=public
      SESSION_SECRET: tenant-isolation-certification-secret-minimum-32-characters
      VERCEL_ENV: ""
      PLAYWRIGHT_E2E: "1"
      TENANT_ISOLATION_E2E: "1"
      TENANT_RLS_APP_ROLE: policydesk_app
      TENANT_RLS_ORG_A: org_legacy_singleton_0001
      TENANT_RLS_ORG_B: org_pedro_gomez_0001
      PLATFORM_NORA_ENABLED: "1"
      PLATFORM_IMPORTS_ENABLED: "1"
      PLATFORM_EXPORTS_ENABLED: "1"
      PLATFORM_UPLOADS_ENABLED: "1"
      PLATFORM_EMAIL_ENABLED: "1"
      PLATFORM_TELEGRAM_ENABLED: "1"
      PLATFORM_WHATSAPP_ENABLED: "1"
      PLATFORM_QUALITAS_ENABLED: "0"
      QUALITAS_PRODUCTION_CERTIFIED: "0"
      PLAYWRIGHT_USE_PRODUCTION_SERVER: "1"
      PLAYWRIGHT_HOST: localhost
      PLAYWRIGHT_BASE_URL: http://localhost:4173
      PORT: "4173"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-ref.outputs.certified_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Create dedicated tenant database
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          createdb -h 127.0.0.1 -U postgres "$TENANT_ISOLATION_DB_NAME"
          fingerprint="$(printf 'local-postgres:%s:%s:%s' "$TENANT_ISOLATION_RUN_ID" "$TENANT_ISOLATION_DB_NAME" '127.0.0.1' | sha256sum | awk '{print $1}')"
          printf 'TENANT_ISOLATION_FINGERPRINT=%s\n' "$fingerprint" >> "$GITHUB_ENV"
      - name: Apply singleton migrations and check drift
        run: |
          npm run db:migrate:singleton-ci
      - name: Check Cycle 1 tenant guards before multi-org fixture
        run: npm run check:tenant-guards
      - name: Mark migrated tenant database
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          db_name="${TENANT_ISOLATION_DB_NAME}"
          host_name="127.0.0.1"
          fingerprint="$(printf 'local-postgres:%s:%s:%s' "$TENANT_ISOLATION_RUN_ID" "$db_name" "$host_name" | sha256sum | awk '{print $1}')"
          psql -h "$host_name" -U postgres -d "$db_name" -v ON_ERROR_STOP=1 <<SQL
          CREATE TABLE "__policydesk_tenant_isolation_run" (
            run_id text PRIMARY KEY,
            database_name text NOT NULL,
            host text NOT NULL,
            fingerprint text NOT NULL,
            created_at timestamptz NOT NULL DEFAULT now()
          );
          INSERT INTO "__policydesk_tenant_isolation_run" (run_id, database_name, host, fingerprint)
          VALUES ('$TENANT_ISOLATION_RUN_ID', '$db_name', '$host_name', '$fingerprint');
          SQL
          printf 'TENANT_ISOLATION_FINGERPRINT=%s\n' "$fingerprint" >> "$GITHUB_ENV"
      - name: Create protected two-organization fixture
        run: npm run test:tenant-fixture
      - name: Enter maintenance before RLS cutover
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          psql -h 127.0.0.1 -U postgres -d "$TENANT_ISOLATION_DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'UPDATE "PlatformRuntimeState" SET "writeMode" = '\''MAINTENANCE'\'', "reason" = '\''release tenant certification'\'', "updatedAt" = now() WHERE "id" = 1;'
      - name: Tenant and knowledge isolation tests
        run: npm run test:unit -- src/lib/organization-context.logic.test.ts src/lib/organization-context-resolution.logic.test.ts src/lib/tenant-isolation.integration.logic.test.ts src/lib/nora-context.logic.test.ts
      - name: Tenant inventory audit after multi-org fixture
        run: node --import tsx scripts/check-tenant-inventory.ts
      - name: Build disposable tenant application
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: Apply versioned RLS cutover as the only schema executor
        run: ENABLE_TENANT_RLS_CUTOVER=1 npm run cutover:multi-org
      - name: Provision restricted runtime credential after RLS
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          psql -h 127.0.0.1 -U postgres -d "$TENANT_ISOLATION_DB_NAME" -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE policydesk_app PASSWORD 'tenant-isolation-runtime-password';"
          runtime_url="postgresql://policydesk_app:tenant-isolation-runtime-password@127.0.0.1:5432/${TENANT_ISOLATION_DB_NAME}?schema=public"
          printf 'TENANT_RLS_RUNTIME_DATABASE_URL=%s\n' "$runtime_url" >> "$GITHUB_ENV"
          printf 'DATABASE_URL=%s\n' "$runtime_url" >> "$GITHUB_ENV"
          printf 'DATABASE_URL_UNPOOLED=%s\n' "$runtime_url" >> "$GITHUB_ENV"
      - name: Exact-role pooled RLS certification
        run: npm run test:tenant-rls
      - name: Check Prisma drift after cutover
        run: npm run db:check-drift
      - name: Reopen disposable tenant after maintenance verification
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          psql -h 127.0.0.1 -U postgres -d "$TENANT_ISOLATION_DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'UPDATE "PlatformRuntimeState" SET "writeMode" = '\''OPEN'\'', "reason" = '\''tenant certification E2E'\'', "updatedAt" = now() WHERE "id" = 1;'
      - name: Tenant isolation E2E after forced RLS
        run: npx playwright test tests/e2e/tenant-isolation.spec.ts
      - name: Drop dedicated tenant database
        if: always()
        shell: bash
        run: |
          export PGPASSWORD=postgres
          dropdb -h 127.0.0.1 -U postgres --if-exists "$TENANT_ISOLATION_DB_NAME"

  disposable-application:
    name: DISPOSABLE POSTGRESQL / APPLICATION API E2E BILLING RESTORE
    needs: resolve-ref
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NODE_ENV: test
      TENANT_ISOLATION_TEST_DB: "1"
      PLAYWRIGHT_ENFORCE_DISPOSABLE_DB: "1"
      TENANT_ISOLATION_RUN_ID: "${{ github.run_id }}_${{ github.run_attempt }}"
      TENANT_ISOLATION_DB_NAME: "policydesk_tenant_test_${{ github.run_id }}_${{ github.run_attempt }}"
      PLAYWRIGHT_USE_PRODUCTION_SERVER: "1"
      PLAYWRIGHT_HOST: localhost
      PLAYWRIGHT_BASE_URL: http://localhost:4173
      PORT: "4173"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/policydesk_tenant_test_${{ github.run_id }}_${{ github.run_attempt }}?schema=public
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/policydesk_tenant_test_${{ github.run_id }}_${{ github.run_attempt }}?schema=public
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/policydesk_tenant_test_${{ github.run_id }}_${{ github.run_attempt }}?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/shadow?schema=public
      SESSION_SECRET: application-certification-secret-minimum-32-characters
      RESTORE_INTEGRATION: "1"
      RESTORE_INTEGRATION_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=public
      VERCEL_ENV: ""
      PLATFORM_NORA_ENABLED: "1"
      PLATFORM_IMPORTS_ENABLED: "1"
      PLATFORM_EXPORTS_ENABLED: "1"
      PLATFORM_UPLOADS_ENABLED: "1"
      PLATFORM_EMAIL_ENABLED: "1"
      PLATFORM_TELEGRAM_ENABLED: "1"
      PLATFORM_WHATSAPP_ENABLED: "1"
      PLATFORM_QUALITAS_ENABLED: "0"
      QUALITAS_PRODUCTION_CERTIFIED: "0"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-ref.outputs.certified_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Create dedicated application database
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          createdb -h 127.0.0.1 -U postgres "$TENANT_ISOLATION_DB_NAME"
          fingerprint="$(printf 'local-postgres:%s:%s:%s' "$TENANT_ISOLATION_RUN_ID" "$TENANT_ISOLATION_DB_NAME" '127.0.0.1' | sha256sum | awk '{print $1}')"
          printf 'TENANT_ISOLATION_FINGERPRINT=%s\n' "$fingerprint" >> "$GITHUB_ENV"
      - name: Apply singleton migrations
        run: npm run db:migrate:singleton-ci
      - name: Tenant guards and transition integration
        run: |
          npm run check:tenant-guards
          npm run test:unit -- src/lib/organization-transition.integration.logic.test.ts
      - name: Billing integration
        run: npm run test:unit -- src/lib/platform-billing.integration.logic.test.ts
      - name: Backup and restore integration
        run: npm run test:unit -- src/lib/backup-restore.integration.logic.test.ts
      - name: Build disposable application
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: API tests
        run: npm run test:api
      - name: Application E2E
        run: npm run test:e2e
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: release-certification-playwright-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload sanitized restore reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-certification-restore-${{ github.run_attempt }}
          path: artifacts/restore-drills
          if-no-files-found: ignore
          retention-days: 90
      - name: Drop dedicated application database
        if: always()
        shell: bash
        run: |
          export PGPASSWORD=postgres
          dropdb -h 127.0.0.1 -U postgres --if-exists "$TENANT_ISOLATION_DB_NAME"

  production-policy:
    name: PRODUCTION VERIFIER POLICY / MAIN ONLY
    if: ${{ inputs.verify_production == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require workflow execution from main
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Production verification may only be requested from main."
            exit 1
          fi

  production-state:
    name: PRODUCTION STATE VERIFICATION / READ ONLY
    if: ${{ inputs.verify_production == true }}
    needs: [resolve-ref, production-policy]
    environment: production-readonly-verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      verifier_sha: ${{ steps.source.outputs.verifier_sha }}
    env:
      DATABASE_URL: ""
      DATABASE_URL_UNPOOLED: ""
      PRODUCTION_READONLY_DATABASE_URL: ${{ secrets.PRODUCTION_READONLY_DATABASE_URL }}
      PRODUCTION_READONLY_ROLE: ${{ vars.PRODUCTION_READONLY_ROLE || 'policydesk_readonly' }}
      TENANT_RLS_APP_ROLE: ${{ vars.TENANT_RLS_APP_ROLE || 'policydesk_app' }}
      TENANT_RLS_PLATFORM_OWNER_ROLE: ${{ vars.TENANT_RLS_PLATFORM_OWNER_ROLE || 'policydesk_platform_owner' }}
      PRODUCTION_EXPECTED_TENANT_MODE: ${{ vars.PRODUCTION_EXPECTED_TENANT_MODE || 'single-org' }}
      NORA_AGENT_MODE: ${{ vars.NORA_AGENT_MODE }}
      PLATFORM_BILLING_MUTATIONS_ENABLED: ${{ vars.PLATFORM_BILLING_MUTATIONS_ENABLED }}
      PLATFORM_NORA_ENABLED: ${{ vars.PLATFORM_NORA_ENABLED }}
      PLATFORM_IMPORTS_ENABLED: ${{ vars.PLATFORM_IMPORTS_ENABLED }}
      PLATFORM_EXPORTS_ENABLED: ${{ vars.PLATFORM_EXPORTS_ENABLED }}
      PLATFORM_UPLOADS_ENABLED: ${{ vars.PLATFORM_UPLOADS_ENABLED }}
      PLATFORM_EMAIL_ENABLED: ${{ vars.PLATFORM_EMAIL_ENABLED }}
      PLATFORM_TELEGRAM_ENABLED: ${{ vars.PLATFORM_TELEGRAM_ENABLED }}
      PLATFORM_WHATSAPP_ENABLED: ${{ vars.PLATFORM_WHATSAPP_ENABLED }}
      PLATFORM_QUALITAS_ENABLED: ${{ vars.PLATFORM_QUALITAS_ENABLED }}
      QUALITAS_PRODUCTION_CERTIFIED: ${{ vars.QUALITAS_PRODUCTION_CERTIFIED }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-ref.outputs.certified_sha }}
          fetch-depth: 1
      - name: Record immutable Production verifier SHA
        id: source
        shell: bash
        run: echo "verifier_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run sanitized read-only verifier
        id: verify
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/production-verification
          node --import tsx scripts/verify-production.ts --json > artifacts/production-verification/production.json
          exit_code=$?
          node -e 'const fs=require("node:fs"); const p="artifacts/production-verification/production.json"; let r={status:"BLOCKED"}; try { r=JSON.parse(fs.readFileSync(p,"utf8")); } catch {} console.log(`status=${r.status || "BLOCKED"}`); fs.appendFileSync(process.env.GITHUB_OUTPUT, `status=${r.status || "BLOCKED"}\n`);'
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Production verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-certification-production-${{ github.run_attempt }}
          path: artifacts/production-verification/production.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail certification unless Production verifier is PASS
        if: steps.verify.outputs.status != 'PASS' || steps.verify.outputs.exit_code != '0'
        run: exit 1

  report:
    name: RELEASE EVIDENCE / SANITIZED REPORT
    if: always()
    needs: [resolve-ref, quality, disposable-tenant, disposable-application, production-policy, production-state]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-ref.outputs.certified_sha }}
          fetch-depth: 1
      - name: Download Production verifier evidence
        if: needs.production-state.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          name: release-certification-production-${{ github.run_attempt }}
          path: artifacts/production-verification
      - name: Create sanitized release report
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TENANT_RESULT: ${{ needs.disposable-tenant.result }}
          APPLICATION_RESULT: ${{ needs.disposable-application.result }}
          PRODUCTION_RESULT: ${{ needs.production-state.result }}
          PRODUCTION_POLICY_RESULT: ${{ needs.production-policy.result }}
          REQUESTED_REF: ${{ inputs.ref }}
          CERTIFIED_SHA: ${{ needs.resolve-ref.outputs.certified_sha }}
          PRODUCTION_VERIFIER_SHA: ${{ needs.production-state.outputs.verifier_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          VERIFY_PRODUCTION: ${{ inputs.verify_production }}
        run: |
          mkdir -p artifacts/release-certification
          node - <<'NODE'
          const fs = require("node:fs");
          const cp = require("node:child_process");
          const productionPath = "artifacts/production-verification/production.json";
          let production = { status: process.env.PRODUCTION_RESULT === "skipped" ? "NOT_RUN" : "UNAVAILABLE" };
          if (fs.existsSync(productionPath)) {
            try {
              const parsed = JSON.parse(fs.readFileSync(productionPath, "utf8"));
              production = { status: parsed.status || "UNAVAILABLE", tenantMode: parsed.tenantMode || "UNKNOWN" };
            } catch {}
          }
          const report = {
            certifiedSha: process.env.CERTIFIED_SHA || cp.execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim(),
            productionVerifierSha: process.env.PRODUCTION_VERIFIER_SHA || null,
            requestedRef: process.env.REQUESTED_REF,
            generatedAt: new Date().toISOString(),
            run: { id: process.env.RUN_ID, attempt: process.env.RUN_ATTEMPT },
            codeCertification: { quality: process.env.QUALITY_RESULT },
            disposablePostgres: {
              tenantIsolation: process.env.TENANT_RESULT,
              applicationApiE2E: process.env.APPLICATION_RESULT,
            },
            productionStateVerification: {
              ...production,
              policy: process.env.PRODUCTION_POLICY_RESULT,
            },
          };
          fs.writeFileSync("artifacts/release-certification/report.json", JSON.stringify(report, null, 2) + "\n");
          fs.writeFileSync("artifacts/release-certification/summary.md", [
            "# PolicyDesk Release Certification",
            "",
            `- Certified SHA: ${report.certifiedSha}`,
            `- Production verifier SHA: ${report.productionVerifierSha || "NOT_RUN"}`,
            `- Generated: ${report.generatedAt}`,
            `- Code certification: ${report.codeCertification.quality}`,
            `- Disposable tenant isolation: ${report.disposablePostgres.tenantIsolation}`,
            `- Disposable application/API/E2E: ${report.disposablePostgres.applicationApiE2E}`,
            `- Production state verification: ${report.productionStateVerification.status}`,
            "",
            "This report contains statuses only; it does not contain credentials, customer data, policy numbers, backup URLs, keys or Nora content.",
            "",
          ].join("\n"));
          const required = {
            quality: process.env.QUALITY_RESULT,
            tenantIsolation: process.env.TENANT_RESULT,
            applicationApiE2E: process.env.APPLICATION_RESULT,
          };
          const failures = Object.entries(required)
            .filter(([, status]) => status !== "success")
            .map(([name, status]) => `${name}=${status || "missing"}`);
          if (process.env.VERIFY_PRODUCTION === "true") {
            if (process.env.PRODUCTION_POLICY_RESULT !== "success") {
              failures.push(`productionPolicy=${process.env.PRODUCTION_POLICY_RESULT || "missing"}`);
            }
            if (process.env.PRODUCTION_RESULT !== "success" || production.status !== "PASS") {
              failures.push(`productionState=${process.env.PRODUCTION_RESULT || "missing"}/${production.status}`);
            }
            if (!report.productionVerifierSha) failures.push("productionVerifierSha=missing");
          }
          if (failures.length) {
            console.error(`Release certification aggregate FAIL: ${failures.join(", ")}`);
            process.exit(1);
          }
          console.log("Release certification aggregate PASS");
          NODE
      - name: Upload sanitized release evidence
        uses: actions/upload-artifact@v6
        with:
          name: release-certification-${{ github.run_attempt }}
          path: artifacts/release-certification
          if-no-files-found: error
          retention-days: 90
