name: Telegram digest scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read

jobs:
  send-digests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Run hourly Telegram digest check
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PRODUCTION_URL: https://policypete.vercel.app
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$PRODUCTION_URL/api/jobs/telegram-digest"
