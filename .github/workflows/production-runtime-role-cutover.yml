name: Production runtime-role cutover

on:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Exact SHA currently serving Production
        required: true
        type: string
      confirmation:
        description: Type CUTOVER_RESTRICTED_RUNTIME
        required: true
        type: string

permissions:
  contents: read
  checks: read
  deployments: write

concurrency:
  group: policydesk-production-release
  cancel-in-progress: false

jobs:
  cutover:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'CUTOVER_RESTRICTED_RUNTIME'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      VERCEL_CLI: vercel@48.11.0
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Verify approved baseline and Environment protection
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ inputs.baseline_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(printf '%s' "$EXPECTED_SHA" | wc -c)" -eq 40
          ENVIRONMENT=$(gh api "repos/$GITHUB_REPOSITORY/environments/production")
          RULES=$(printf '%s' "$ENVIRONMENT" | jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers | length] | add // 0')
          test "$RULES" -ge 1
          printf '%s' "$ENVIRONMENT" | jq -e '.deployment_branch_policy.custom_branch_policies == true' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/environments/production/deployment-branch-policies" --jq '[.branch_policies[] | select(.name == "main")] | length == 1' | grep -qx true

      - name: Install release tooling
        run: npm ci

      - name: Verify Production Neon topology before recovery mutation
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_ADMIN_URL_UNPOOLED }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          EXPECTED_DATABASE_FINGERPRINT: ${{ secrets.EXPECTED_DATABASE_FINGERPRINT }}
        run: |
          TOPOLOGY=$(npm run --silent init:deployment-db-identity -- --environment production --project-id "${{ secrets.NEON_PROJECT_ID }}" --branch-id "${{ secrets.NEON_PRODUCTION_BRANCH_ID }}" --database "${{ secrets.NEON_DATABASE_NAME }}" --endpoint-id "${{ secrets.NEON_PRODUCTION_ENDPOINT_ID }}" --topology-only --json)
          printf '%s' "$TOPOLOGY" | jq -e '.mode == "topology-only" and .providerTopologyVerified == true and .productionBranchProtected == true and .databaseMutationAttempted == false' >/dev/null
          test "$(printf '%s' "$TOPOLOGY" | jq -r '.derivedFingerprint // empty')" = "$EXPECTED_DATABASE_FINGERPRINT"

      - name: Verify current Production deployment SHA
        env:
          EXPECTED_SHA: ${{ inputs.baseline_sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          RESPONSE=$(curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&state=READY&limit=1")
          ACTIVE_SHA=$(printf '%s' "$RESPONSE" | jq -r '.deployments[0].meta.githubCommitSha // empty')
          ACTIVE_ID=$(printf '%s' "$RESPONSE" | jq -r '.deployments[0].uid // empty')
          test "$ACTIVE_SHA" = "$EXPECTED_SHA"
          test -n "$ACTIVE_ID"
          printf 'BASELINE_DEPLOYMENT_ID=%s\n' "$ACTIVE_ID" >> "$GITHUB_ENV"

      - name: Create protected recovery branch before migration
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PRODUCTION_BRANCH_ID: ${{ secrets.NEON_PRODUCTION_BRANCH_ID }}
        run: |
          NAME="recovery-cutover-${GITHUB_RUN_ID}"
          BODY=$(jq -n --arg parent "$NEON_PRODUCTION_BRANCH_ID" --arg name "$NAME" '{branch:{parent_id:$parent,name:$name,protected:true},endpoints:[{type:"read_write"}]}')
          RESPONSE=$(curl --fail --silent --show-error --max-time 30 -X POST -H "Authorization: Bearer $NEON_API_KEY" -H 'Content-Type: application/json' --data "$BODY" "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches")
          RECOVERY_ID=$(printf '%s' "$RESPONSE" | jq -r '.branch.id // empty')
          RECOVERY_PARENT=$(printf '%s' "$RESPONSE" | jq -r '.branch.parent_id // empty')
          RECOVERY_PROTECTED=$(printf '%s' "$RESPONSE" | jq -r '.branch.protected // false')
          test -n "$RECOVERY_ID"
          test "$RECOVERY_PARENT" = "$NEON_PRODUCTION_BRANCH_ID"
          test "$RECOVERY_PROTECTED" = true
          printf 'RECOVERY_BRANCH_ID=%s\n' "$RECOVERY_ID" >> "$GITHUB_ENV"

      - name: Migrate, initialize identity, provision and audit runtime role
        env:
          NODE_ENV: production
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_ADMIN_URL_UNPOOLED }}
          DATABASE_RUNTIME_URL: ${{ secrets.DATABASE_RUNTIME_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_RUNTIME_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          EXPECTED_DATABASE_ENV: production
          EXPECTED_DATABASE_FINGERPRINT: ${{ secrets.EXPECTED_DATABASE_FINGERPRINT }}
          EXPECTED_DATABASE_ROLE: policydesk_runtime
          ALLOW_PRODUCTION_DEPLOYMENT_IDENTITY_APPLY: "1"
        run: |
          DATABASE_URL="${{ secrets.DATABASE_ADMIN_URL_UNPOOLED }}" npx prisma migrate deploy
          IDENTITY=$(npm run --silent init:deployment-db-identity -- --environment production --project-id "${{ secrets.NEON_PROJECT_ID }}" --branch-id "${{ secrets.NEON_PRODUCTION_BRANCH_ID }}" --database "${{ secrets.NEON_DATABASE_NAME }}" --endpoint-id "${{ secrets.NEON_PRODUCTION_ENDPOINT_ID }}" --apply --json)
          test "$(printf '%s' "$IDENTITY" | jq -r '.derivedFingerprint // empty')" = "$EXPECTED_DATABASE_FINGERPRINT"
          printf '%s' "$IDENTITY" | jq -e '.fingerprintMatches == true and .providerTopologyVerified == true and .productionBranchProtected == true' >/dev/null
          npm run provision:database-runtime-role
          npm run provision:database-runtime-role -- --apply
          npm run check:deployment-db-safety -- --admin

      - name: Replace Vercel runtime database variables
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DATABASE_RUNTIME_URL: ${{ secrets.DATABASE_RUNTIME_URL }}
          EXPECTED_DATABASE_FINGERPRINT: ${{ secrets.EXPECTED_DATABASE_FINGERPRINT }}
        run: |
          printf '%s' "$DATABASE_RUNTIME_URL" | npx --yes "$VERCEL_CLI" env add DATABASE_URL production --force --token "$VERCEL_TOKEN"
          printf '%s' production | npx --yes "$VERCEL_CLI" env add EXPECTED_DATABASE_ENV production --force --token "$VERCEL_TOKEN"
          printf '%s' "$EXPECTED_DATABASE_FINGERPRINT" | npx --yes "$VERCEL_CLI" env add EXPECTED_DATABASE_FINGERPRINT production --force --token "$VERCEL_TOKEN"
          printf '%s' policydesk_runtime | npx --yes "$VERCEL_CLI" env add EXPECTED_DATABASE_ROLE production --force --token "$VERCEL_TOKEN"
          for key in DATABASE_URL_UNPOOLED DATABASE_RUNTIME_URL PRODUCTION_DATABASE_URL_UNPOOLED NEON_API_KEY PGPASSWORD POSTGRES_PRISMA_URL POSTGRES_URL_NO_SSL POSTGRES_URL_NON_POOLING POSTGRES_URL POSTGRES_PASSWORD POSTGRES_HOST POSTGRES_USER POSTGRES_DATABASE PGHOST_UNPOOLED PGHOST PGUSER PGDATABASE NEON_PROJECT_ID; do
            npx --yes "$VERCEL_CLI" env rm "$key" production --yes --token "$VERCEL_TOKEN" || true
          done
          ENVS=$(curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env")
          printf '%s' "$ENVS" | jq -e '[.envs[] | select((.target | index("production")) and (.key | IN("DATABASE_URL_UNPOOLED", "DATABASE_RUNTIME_URL", "PRODUCTION_DATABASE_URL_UNPOOLED", "NEON_API_KEY", "PGPASSWORD", "POSTGRES_PRISMA_URL", "POSTGRES_URL_NO_SSL", "POSTGRES_URL_NON_POOLING", "POSTGRES_URL", "POSTGRES_PASSWORD", "POSTGRES_HOST", "POSTGRES_USER", "POSTGRES_DATABASE", "PGHOST_UNPOOLED", "PGHOST", "PGUSER", "PGDATABASE", "NEON_PROJECT_ID")))] | length == 0' >/dev/null
          printf '%s' "$ENVS" | jq -e '[.envs[] | select((.target | index("production")) and .key == "DATABASE_URL")] | length == 1' >/dev/null

      - name: Build and deploy the approved baseline
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_ADMIN_URL_UNPOOLED }}
        run: |
          git checkout --detach "${{ inputs.baseline_sha }}"
          npm ci
          npx --yes "$VERCEL_CLI" pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx --yes "$VERCEL_CLI" build --prod --token "$VERCEL_TOKEN"
          DEPLOYMENT_URL=$(npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --skip-domain --token "$VERCEL_TOKEN")
          printf 'CUTOVER_DEPLOYMENT_URL=%s\n' "$DEPLOYMENT_URL" >> "$GITHUB_ENV"

      - name: Verify candidate SHA and READY state
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EXPECTED_SHA: ${{ inputs.baseline_sha }}
        run: |
          HOST=${CUTOVER_DEPLOYMENT_URL#https://}
          DETAIL=$(curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$HOST")
          test "$(printf '%s' "$DETAIL" | jq -r '.readyState // empty')" = READY
          test "$(printf '%s' "$DETAIL" | jq -r '.meta.githubCommitSha // empty')" = "$EXPECTED_SHA"
          CUTOVER_ID=$(printf '%s' "$DETAIL" | jq -r '.id // .uid // empty')
          test -n "$CUTOVER_ID"
          printf 'CUTOVER_DEPLOYMENT_ID=%s\n' "$CUTOVER_ID" >> "$GITHUB_ENV"

      - name: Authenticated smoke on restricted baseline
        id: smoke
        continue-on-error: true
        env:
          PRODUCTION_SMOKE_BASE_URL: ${{ env.CUTOVER_DEPLOYMENT_URL }}
          PRODUCTION_SMOKE_EMAIL: ${{ secrets.PRODUCTION_SMOKE_EMAIL }}
          PRODUCTION_SMOKE_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_PASSWORD }}
        run: |
          git checkout --detach "${{ github.sha }}"
          npm ci
          npx playwright install --with-deps chromium
          npm run smoke:production-release

      - name: Verify previous alias remained unchanged on failed cutover smoke
        if: steps.smoke.outcome != 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          ACTIVE=$(curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&state=READY&limit=1")
          test "$(printf '%s' "$ACTIVE" | jq -r '.deployments[0].uid // empty')" = "$BASELINE_DEPLOYMENT_ID"
          exit 1

      - name: Inspect cutover candidate runtime logs
        if: steps.smoke.outcome == 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          EVENTS=$(curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v2/deployments/$CUTOVER_DEPLOYMENT_ID/events?limit=1000")
          printf '%s' "$EVENTS" | jq -e '[.[]? | select(((.text // "") | test("P2022|User.platformRole|missing column|Prisma schema"; "i")))] | length == 0' >/dev/null

      - name: Promote restricted baseline only after smoke PASS
        if: steps.smoke.outcome == 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes "$VERCEL_CLI" promote "$CUTOVER_DEPLOYMENT_URL" --token "$VERCEL_TOKEN" --yes

      - name: Write sanitized evidence
        run: |
          mkdir -p artifacts/production-release
          jq -n --arg sha "${{ inputs.baseline_sha }}" --arg previous "$BASELINE_DEPLOYMENT_ID" --arg deployment "$CUTOVER_DEPLOYMENT_ID" --arg recovery "$RECOVERY_BRANCH_ID" --arg run "$GITHUB_RUN_ID" '{status:"PASS",sha:$sha,previousDeploymentId:$previous,deploymentId:$deployment,recoveryBranchId:$recovery,runId:$run,migrations:"applied",identityAudit:"PASS",runtimeRole:"policydesk_runtime",runtimeLogs:"PASS",smoke:"PASS",promotion:"PASS",releaseType:"initial-cutover"}' > artifacts/production-release/release.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-release-${{ github.run_id }}
          path: artifacts/production-release
          if-no-files-found: warn
          retention-days: 90
